name: Build package in nixpkgs fork

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
      attribute:
        description: 'Attribute to build'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: nix build -L --no-link github:chvp/nixpkgs/${{ github.event.inputs.branch }}#${{ github.event.inputs.attribute }}
