name: Build package in nixpkgs fork

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
      attribute:
        description: 'Attribute to build'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Build
        run: nix build -L --no-link github:chvp/nixpkgs/${{ github.event.inputs.branch }}#${{ github.event.inputs.attribute }}
