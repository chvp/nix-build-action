name: Build generic

on:
  workflow_dispatch:
    inputs:
      before_system:
        description: 'Before system'
        required: true
      after_system:
        description: 'After system'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]
          then
            export SYSTEM=x86_64-linux
          elif [ "${{ matrix.os }}" = "macos-latest" ]
          then
            export SYSTEM=aarch64-darwin
          elif [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]
          then
            export SYSTEM=aarch64-linux
          fi
          nix build -L --no-link '${{ github.event.inputs.before_system }}'.$SYSTEM.'${{ github.event.inputs.after_system }}'
