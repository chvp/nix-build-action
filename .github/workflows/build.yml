name: Build generic

on:
  workflow_dispatch:
    inputs:
      before_system:
        description: 'Before system'
        required: true
      after_system:
        description: 'After system'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Build
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]
          then
            export SYSTEM=x86_64-linux
          elif [ "${{ matrix.os }}" = "macos-latest" ]
          then
            export SYSTEM=aarch64-darwin
          elif [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]
          then
            export SYSTEM=aarch64-linux
          fi
          nix build -L --no-link '${{ github.event.inputs.before_system }}'.$SYSTEM.'${{ github.event.inputs.after_system }}'
