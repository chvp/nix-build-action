name: Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch in personal nixpkgs fork'
        required: true
      attribute:
        description: 'Attribute to build'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: nix build -L --no-link github:chvp/nixpkgs/${{ github.event.inputs.branch }}#${{ github.event.inputs.attribute }}
